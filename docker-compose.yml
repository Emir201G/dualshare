services:
  mysql_database:
    image: mysql:8.4
    container_name: mysql_database
    restart: unless-stopped

    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: dualshare

    ports:
      - "3307:3306"

    volumes:
      - mysql-volume:/var/lib/mysql

    networks:
      - dualshare-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dualshare-api:
    image: dualshare-api-image
    container_name: dualshare-api
    restart: unless-stopped

    depends_on:
      mysql_database:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_database:3306/dualshare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

    networks:
      - dualshare-network

networks:
  dualshare-network:

volumes:
  mysql-volume: